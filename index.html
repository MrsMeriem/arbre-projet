<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Arbre du projet CRL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F4F3EF;--dot:#D9D6CC;--card:#FFFFFF;--ink:#191917;--ink2:#55534D;--mut:#8C8A82;--line:#E7E5DD;--line2:#D6D3C8;
--acc:#2F5BEA;--accbg:#ECF0FE;--ok:#1F8A4C;--okbg:#E7F6EC;--warn:#C26A0A;--warnbg:#FFF2E0;--bad:#C2361F;--pur:#6C4CE0;--purbg:#F1EDFE;--gate:#9A5B00;--gatebg:#FFF7E6;
--post:#FFF3B8;--postink:#5C4500;--sh:0 1px 2px rgba(20,20,15,.05),0 6px 20px rgba(20,20,15,.07);--sh2:0 2px 4px rgba(20,20,15,.06),0 16px 40px rgba(20,20,15,.14)}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:var(--ink)}
#cv{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:default;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px)}
#cv.grab{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.eg{fill:none;stroke:var(--line2);stroke-width:2}
.eg.win{stroke:var(--ok);stroke-width:2.5}
.eg.cut{stroke-dasharray:5 6;opacity:.5}
.eg.dash{stroke-dasharray:3 5;opacity:.7}
.el{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line2);color:var(--ink2);box-shadow:var(--sh)}
.el.win{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.el.cut{opacity:.55;text-decoration:line-through}
.nd{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s,border-color .15s,transform .15s}
.nd:hover{box-shadow:var(--sh2);border-color:var(--line2)}
.nd.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg),var(--sh2)}
.nd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line2)}
.st-todo::before{background:var(--pur)}.st-doing::before{background:var(--acc)}.st-done::before{background:var(--ok)}.st-late::before{background:var(--warn)}
.nd.cut{opacity:.42;filter:grayscale(.7)}
.nd-head,.nd-title,.nd-prog,.nd-foot{flex:none}
.nd-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.kick{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--mut);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-todo{background:var(--purbg);color:var(--pur)}.p-doing{background:var(--accbg);color:var(--acc)}.p-done{background:var(--okbg);color:var(--ok)}.p-late{background:var(--warnbg);color:var(--warn)}.p-gate{background:var(--gatebg);color:var(--gate)}

.nd-prog{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.nd-prog b{font-size:12px;font-weight:600;color:var(--ink2);min-width:34px;text-align:right}
.leaves{display:flex;flex-direction:column;gap:4px;flex:1}
.lf{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;font-size:13px;transition:background .15s,border-color .15s}
.lf:hover{border-color:var(--acc);background:var(--accbg)}
.lf .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.lf.d .dot{background:var(--ok)}.lf.l .dot{background:var(--warn)}.lf.d .lt{color:var(--mut);text-decoration:line-through}
.lt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.lc{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.na{font-size:11px;color:var(--mut)}
.more{font-size:12px;color:var(--mut);padding:2px 4px}
.nd-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-top:10px;height:22px}
.avs{display:flex}.avs .av{margin-left:-6px;border:2px solid var(--card)}.avs .av:first-child{margin-left:0}
.av{width:22px;height:22px;border-radius:50%;background:var(--accbg);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none}
.av.g{background:var(--purbg);color:var(--pur)}
.gt{background:var(--gatebg);border:1.5px dashed var(--gate)}
.gt::before{display:none}
.gt.decided{border-style:solid;border-color:var(--ok)}
.dia{width:9px;height:9px;background:var(--gate);transform:rotate(45deg);border-radius:2px;display:inline-block}
.hyp{font-size:13px;color:var(--ink2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.add{flex-direction:row;align-items:center;justify-content:center;gap:0;background:transparent;border:1.5px dashed var(--line2);box-shadow:none;padding:0;color:var(--mut);font-weight:600;font-size:13px}
.add::before{display:none}.add:hover{box-shadow:none;border-color:var(--acc)}
.add span{flex:1;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:14px}
.add span:hover{color:var(--acc);background:var(--accbg)}
.add i{width:1px;height:24px;background:var(--line2)}
#world.far .leaves,#world.far .nd-prog b,#world.far .hyp{visibility:hidden}
#world.far .nd-title{font-size:26px;line-height:30px}
#top{position:fixed;left:12px;right:12px;top:12px;z-index:10;display:flex;align-items:center;gap:10px;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:6px 6px 6px 14px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.gp,.sticky,.tb{white-space:nowrap}
.gp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:600}
.gp .track{width:90px;flex:none}
.tb{border:none;background:transparent;padding:7px 11px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap}
.tb:hover{background:var(--bg)}.tb.on{background:var(--ink);color:var(--bg)}
.sp1{flex:1}
#zoom{position:fixed;right:12px;bottom:12px;z-index:10;display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:4px}

#legend{position:fixed;left:12px;bottom:12px;z-index:9;display:flex;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:8px 12px;font-size:12px;color:var(--ink2)}
#legend span{display:flex;align-items:center;gap:6px}#legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#empty{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--mut);pointer-events:none;text-align:center;padding:40px}

.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph b{font-size:13px;color:var(--mut);font-weight:600}

#app{overflow:auto;padding:14px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}

 #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:72vh;border-radius:20px 20px 0 0;animation:pup .25s ease}

 #legend{display:none}

}

@media(max-width:520px){#top{gap:6px;left:8px;right:8px}.bar{padding:4px 4px 4px 10px}.tb{padding:7px 8px}.gp .track{width:36px}.brand{display:none}.sticky{padding:9px 10px;font-size:12px}.sticky .lbl{display:none}}
.pen{border:1px solid var(--line)!important;background:var(--card)!important;width:34px;height:34px;padding:0!important;border-radius:10px!important;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none;cursor:pointer}
.pen:hover{color:var(--acc);border-color:var(--acc)!important}
.pen.on{width:auto;padding:0 12px!important;background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important;font-weight:600;font-size:13px}
.gcur{font-size:12px;font-weight:600;color:var(--acc);background:var(--accbg);padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.sticky{pointer-events:auto;display:flex;align-items:center;gap:8px;border:none;cursor:pointer;background:var(--post);color:var(--postink);font-weight:700;font-size:13px;padding:10px 14px;border-radius:12px;box-shadow:var(--sh);transform:rotate(-1.5deg);transition:transform .15s}
.sticky:hover,.sticky.on{transform:rotate(0) translateY(-1px);box-shadow:var(--sh2)}
.sticky .lbl2{display:none}@media(max-width:520px){.sticky .lbl2{display:inline}}
.sticky b{background:var(--postink);color:var(--post);border-radius:999px;font-size:11px;padding:1px 7px;min-width:20px;text-align:center}.sticky b:empty{display:none}
.pin{width:10px;height:10px;border-radius:50%;background:#E5484D;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.stk{position:absolute;width:210px;height:104px;background:var(--post);color:var(--postink);border-radius:4px 4px 14px 4px;padding:12px 14px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.stk:hover{box-shadow:var(--sh2)}
.stk-t{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stk-a{font-size:11px;opacity:.75}
.stk-h{position:absolute;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.02em}
.col-yellow{background:var(--post)!important;color:var(--postink)!important}
.col-red{background:#FFD4D0!important;color:#8A1C14!important}
.col-pink{background:#FBD5EA!important;color:#7A1F52!important}
.col-blue{background:#D3E4FF!important;color:#123F8C!important}
.col-green{background:#D2F1DC!important;color:#11552A!important}

.sw{width:22px;height:22px;border-radius:50%;padding:0!important;border:2px solid transparent!important;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.sm{width:16px;height:16px}
.sw.on{border-color:var(--ink)!important}
.stk{touch-action:none;user-select:none;-webkit-user-select:none}
.stk.drag{cursor:grabbing;box-shadow:var(--sh2);z-index:5;transform:rotate(0) scale(1.04)!important}
.mini-ed{border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;background:var(--bg)}
.mini-ed input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--ok)}
.mlink{font-size:12px;font-weight:600;color:var(--acc);text-decoration:none;background:var(--accbg);padding:2px 8px;border-radius:999px;white-space:nowrap}
.na2{font-size:11px;color:var(--mut);white-space:nowrap}
html[data-theme=dark]{color-scheme:dark;--bg:#161615;--dot:#2C2B28;--card:#22211F;--ink:#F2F0EA;--ink2:#C9C6BC;--mut:#8E8B82;--line:#33322E;--line2:#45433E;
--acc:#7C9BFF;--accbg:#1E2A55;--ok:#5CCB8A;--okbg:#143322;--warn:#F2A33A;--warnbg:#3A2508;--bad:#F27A66;--pur:#A893FF;--purbg:#2A2150;--gate:#F2B84B;--gatebg:#33260A;
--post:#3D3412;--postink:#F5DE8A;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);--sh2:0 2px 4px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.5)}
html[data-theme=dark] .col-red{background:#4E1A16!important;color:#FFB4AC!important}
html[data-theme=dark] .col-pink{background:#4A1834!important;color:#F7B3DA!important}
html[data-theme=dark] .col-blue{background:#152B52!important;color:#A9C8FF!important}
html[data-theme=dark] .col-green{background:#123422!important;color:#9FE2B6!important}
h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{justify-content:space-between}
.bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:60px}
#app button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:500}
#app button:hover{border-color:var(--line2)}
#app button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
#app button.lnk{border:none;background:none;color:var(--acc);padding:4px;font-weight:600}

input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}

textarea{resize:vertical;min-height:64px}

.mut{color:var(--mut);font-size:13px}

const COLORS=[['yellow','Jaune'],['red','Rouge'],['pink','Rose'],['blue','Bleu'],['green','Vert']];

function apply(){const{x,y,k}=S.cam;world.style.transform=`translate(${x}px,${y}px) scale(${k})`;

const ptr=new Map();let drag=null,moved=false;

}
function swatches(cur,on,small){return COLORS.map(([c,l])=>h('button',{class:'sw col-'+c+(c===cur?' on':'')+(small?' sm':''),title:l,'aria-label':'Couleur '+l,onclick:e=>{e.stopPropagation();on(c)}}))}
async function resolveNames(ids){
  const miss=[...new Set(ids)].filter(i=>i&&!(i in S.names));if(!miss.length||!user)return;
  miss.forEach(i=>S.names[i]='');
  try{const ps=await user.profiles(miss);let ch=false;miss.forEach(i=>{const n=ps&&ps[i]&&ps[i].name;if(n){S.names[i]=n;ch=true}});if(ch)render()}catch(e){}
}

function boardView(){
  app.append(h('p',{class:'mut',style:'margin-top:0'},'Les messages pour tout le groupe : rappels, alertes, retours du prof ou de l\'entreprise.'));
  remarksBox({id:'__project'},true);
}
function tasksView(){
  const opts=['','__none',GRP,...S.team];
  app.append(h('div',{class:'row'},h('label',{class:'mut'},'Voir les tâches de'),
    h('select',{style:'flex:1',onchange:e=>{S.who=e.target.value;render()}},opts.map(o=>h('option',{value:o,selected:o===S.who?'selected':null},o===''?'Tout le monde':o==='__none'?'À assigner':oLabel(o))))));
  let ts=S.tasks.filter(t=>S.who===''?true:tPeople(t).includes(S.who==='__none'?'':S.who));
  const ord=Object.fromEntries(S.stages.map(s=>[s.id,s.order||0]));
  ts=ts.filter(t=>t.stageId in ord&&live(t)).sort((a,b)=>(tDone(a)-tDone(b))||((a.due||'9')>(b.due||'9')?1:-1)||(ord[a.stageId]-ord[b.stageId]));
  if(!ts.length)app.append(h('p',{class:'mut'},'Aucune tâche ici.'));
  ts.forEach(t=>{const s=S.stages.find(x=>x.id===t.stageId),[u,v]=units(t),late=tLate(t),done=tDone(t);
    app.append(h('button',{class:'node'+(done?' done':late?' late':''),style:'margin:8px 0',onclick:()=>openTask(t)},
      h('div',{class:'row sp'},h('h3',null,t.title),done?h('span',{class:'chip c-done'},'Fait'):late?h('span',{class:'chip c-late'},'En retard'):null),
      h('div',{class:'mut'},s.title+' · '+oLabel(t.owner)+(t.due?' · pour le '+fdate(t.due):'')+' · '+u+'/'+v)))});
}

function teamView(){
  app.append(h('h2',null,'Équipe'),h('p',{class:'mut'},'Les noms ajoutés ici apparaissent dans le choix du responsable de chaque tâche.'));
  const save=n=>W(db.doc('config/team').set({members:n}));
  S.team.forEach((m,i)=>{const n=S.tasks.filter(t=>tPeople(t).includes(m)),d=n.filter(tDone).length;
    app.append(h('div',{class:'card row sp'},h('span',{class:'row'},h('span',{class:'av'},ini(m)),m),h('span',{class:'mut'},d+'/'+n.length+' tâches'),
      S.canWrite?h('button',{class:'lnk dng',onclick:()=>save(S.team.filter((_,j)=>j!==i))},'Retirer'):null))});
  if(S.canWrite){const ni=h('input',{placeholder:'Prénom'});const add=()=>{const v=ni.value.trim();if(!v||S.team.includes(v))return;ni.value='';save([...S.team,v])};
    ni.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
    app.append(h('div',{class:'row',style:'flex-wrap:nowrap;margin-top:8px'},ni,h('button',{class:'pri',onclick:add},'Ajouter')));}
  app.append(h('div',{class:'note',style:'margin-top:16px'},"Pour ajouter quelqu'un : ajoute son e-mail dans la table allowed_emails de Supabase, puis envoie-lui le lien de l'app."));
  if(window.__logout)app.append(h('button',{style:'margin-top:12px',onclick:()=>window.__logout()},'Se déconnecter ('+(me||'')+')'));
}

(async()=>{
  db=await claude.use('db');
  if(!db){document.getElementById('empty').textContent='Connexion impossible.';return}
  user=await claude.use('user');
  try{me=user?await user.id():null}catch(e){}
  try{const c=user?await user.can('data.write'):null;if(c===false)S.canWrite=false}catch(e){}
  const timer=setTimeout(()=>{if(!S.got.stages){document.getElementById('empty').textContent="Les données ne sont pas encore joignables. La page se mettra à jour toute seule."}},10000);
  const err=()=>{clearTimeout(timer);toast('Connexion aux données interrompue')};
  const sub=(name,q)=>q.onSnapshot(s=>{S[name]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){S.got[name]=true;if(name==='stages')clearTimeout(timer)}render()},err);
  sub('stages',db.collection('stages').orderBy('order'));
  sub('tasks',db.collection('tasks').orderBy('order'));
  sub('remarks',db.collection('remarks').orderBy('at'));
  db.doc('config/team').onSnapshot(d=>{S.team=(d.exists&&d.data().members)||[];render()},err);
})();

</script>
